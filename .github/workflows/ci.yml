name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Qt (even offscreen) and OpenCV need these shared libraries on a bare runner.
      # QtMultimedia (alert sounds) links libpulse; MediaPipe's pose landmarker
      # loads libGLESv2.
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgles2 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Private-data guard
        run: python tools/check_private_data.py

      - name: Module headers
        run: python tools/check_headers.py

      - name: Ruff lint
        run: ruff check

      - name: Ruff format
        run: ruff format --check

      - name: Import layering
        run: lint-imports

      # Video-fixture integration tests self-skip here: the fixture is private.
      - name: Tests
        run: python -m pytest -q --ignore=tests/test_alert_manager.py

      # QtMultimedia can hang on some machines, so this runs alone with a timeout.
      - name: Alert manager tests
        if: hashFiles('tests/test_alert_manager.py') != ''
        timeout-minutes: 5
        run: python -m pytest -q tests/test_alert_manager.py
